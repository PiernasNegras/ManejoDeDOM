<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="image/png" href="imagenes/rgb.png">
  <title>Color RGB</title>
</head>

<body>
    <div class="contenedor-principal">
      <div class="contenerdor-interno">
        <div class="color">
          <label for="rojo"> Rojo (R)</label>
            <input id="rojo" type="range" min="0" max="255" value="23" step="1">
            <p id="texto-rojo"></p>
        </div>
      </div>

      <div class="contenerdor-interno">
        <div class="color">
          <label for="verde">Verde (V)</label>
            <input id="verde" type="range" min="0" max="255" value="41" step="1">
            <p id="texto-verde"></p>
        </div>
      </div>

      <div class="contenerdor-interno">
        <div class="color">
          <label for="azul">Azul (A)</label>
            <input id="azul" type="range" min="0" max="255" value="56" step="1">
              <p id="texto-azul"></p>
        </div>    
      </div>
        
    </div>

    <footer>
        <p><small>Desarrollado por <a href="https://www.linkedin.com/in/nahuel-martinez-7b898a218/" target="_blank">Nahuel Martinez</a> estudiante de Lic. en Gestión de Tecnologías de la Información, Universidad Nacional de José C. Paz - <a href="https://www.unpaz.edu.ar/gestiontecnologias" target="_blank">UNPAZ</a> </small></p>
    </footer>
  <script src="app.js"></script>
</body>
</html>
